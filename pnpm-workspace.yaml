  'brace-expansion@1.1.16': 5.0.8
  'brace-expansion@2.0.2': 5.0.8
  fast-xml-parser: 5.10.1
  lodash: 4.18.1
  'minimatch@3': 3.1.5
  postcss: 8.5.23
  'postcss@8.4.31': 8.5.23
  sharp: 0.35.3
  'sharp@0.34.5': 0.35.3
  'uuid@8': 11.1.1
  'uuid@8.3.2': 11.1.1
  ws: 8.21.1
